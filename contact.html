<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Khawaja Anas Javed</title>
  <meta name="theme-color" content="#060b17">
  <meta name="description" content="Contact Khawaja Anas Javed.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="scanline" aria-hidden="true"></div>
  <nav class="navbar">
    <a href="index.html" class="brand">Khawaja Anas <span>Javed</span></a>
    <button class="menu-btn" id="menu-btn" aria-label="Toggle menu">☰</button>
    <div class="nav-links" id="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="skills.html">Skills</a>
      <a href="ai-lab.html">AI Lab</a>
      <a href="projects.html">Projects</a>
      <a href="experience.html">Experience</a>
      <a href="contact.html" class="active">Contact</a>
      <button class="btn small" id="cv-btn-nav">⬇ CV</button>
    </div>
  </nav>

  <main>
    <section id="contact" class="section reveal in page-sec">
      <h2 class="sec-title">Get In Touch</h2>
      <div class="contact-grid">
        <form id="contact-form" class="panel form" method="POST">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="Your name" required>
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="How can I help you?" required></textarea>
          <button type="submit" class="btn" id="submit-btn">Send Message</button>
          <p id="form-status" class="status" role="status"></p>
        </form>
        <aside class="panel info">
          <h3>Direct Contact</h3>
          <p>✉ <a id="c-email"></a></p>
          <p>🐙 <a id="c-gh" target="_blank" rel="noopener"></a></p>
          <p>💼 <a id="c-li" target="_blank" rel="noopener">LinkedIn</a></p>
          <p>📍 <span id="c-loc"></span></p>
          <button class="btn ghost" id="cv-btn-contact">⬇ Download CV (PDF)</button>
        </aside>
      </div>
    </section>
  </main>

  <footer class="footer"><span class="mono">© <span id="year"></span> Khawaja Anas Javed · built with HTML, CSS &amp; JS</span></footer>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script defer src="data.js"></script>
  <script defer src="script.js"></script>
  <script defer src="mouse-fx.js"></script>
</body>
</html>
